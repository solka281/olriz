<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 6vh;
      width: 100%;
    }

    .tv-wrapper {
      display: inline-block;
    }

    .tv-wrapper img {
      display: block;
      max-width: min(420px, 80vw);
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tv-wrapper">
      <img src="tv2.jpg" alt="" />
    </div>
  </div>

  <audio id="glitch-snd" src="glitch1.wav" preload="auto"></audio>
  <canvas id="date-canvas" style="display:block;margin-top:3vh;"></canvas>
  <script>
    (function(){
      var d=new Date();
      if(d.getDate()===27&&d.getMonth()===4&&d.getFullYear()===1997){
        var parts=['in','so','al','y ',' fi','rs','t'];
        var msg=parts.join('');
        var cv=document.getElementById('date-canvas');
        var fs=Math.max(14,Math.round(window.innerWidth*0.025));
        cv.width=Math.round(msg.length*fs*0.65);
        cv.height=fs*2;
        var ctx=cv.getContext('2d');
        ctx.font='700 '+fs+'px serif';
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.textBaseline='middle';
        ctx.fillText(msg,0,cv.height/2);
      }

      var seq='';
      var code=atob('bXJkb2M=');
      document.addEventListener('keydown',function(e){
        seq=(seq+e.key).slice(-code.length);
        if(seq===code){
          seq='';
          var snd=document.getElementById('glitch-snd');
          var img=document.createElement('img');
          img.src=atob('bXJkb2MucG5n');
          img.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:min(500px,90vw);max-height:90vh;z-index:9999;pointer-events:none;';
          document.body.appendChild(img);
          snd.currentTime=0;
          snd.play();
          setTimeout(function(){document.body.removeChild(img);},1000);
        }
      });
    })();
  </script>
</body>
</html>
