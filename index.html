<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:#000;
      color:#00ff00;
      font-family:'Courier New', monospace;
      overflow:hidden;
    }

    #logo {
      display:block;
      max-width:min(280px,60vw);
      height:auto;
      position:absolute;
      top:3vh;
      left:50%;
      transform:translateX(-50%);
    }

    #beach {
      display:block;
      max-width:min(420px,80vw);
      height:auto;
      position:absolute;
      top:calc(3vh + 80px);
      left:50%;
      transform:translateX(-50%);
    }

    #admin-msg {
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:50;
      display:none;
      pointer-events:none;
      min-width:min(480px,85vw);
      max-width:min(600px,90vw);
      background:rgba(0,0,0,0.93);
      border:1px solid #ff00ff;
      box-shadow:0 0 24px rgba(255,0,255,0.25), inset 0 0 30px rgba(255,0,255,0.04);
      font-family:'Courier New', monospace;
    }

    #admin-msg .box-titlebar {
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 14px;
      border-bottom:1px solid #330033;
      background:rgba(255,0,255,0.06);
    }

    #admin-msg .box-dot {
      width:8px; height:8px;
      border-radius:50%;
      background:#ff00ff;
      box-shadow:0 0 6px #ff00ff;
      flex-shrink:0;
    }

    #admin-msg .box-title {
      font-size:11px;
      color:#550055;
      letter-spacing:0.2em;
      text-transform:uppercase;
      flex:1;
    }

    #admin-msg .box-body {
      padding:22px 28px;
      text-align:center;
    }

    #admin-msg .box-prompt {
      font-size:11px;
      color:#550055;
      margin-bottom:10px;
      text-align:left;
    }

    #admin-msg .box-text {
      font-size:clamp(1rem,2.5vw,1.5rem);
      color:#ff00ff;
      text-shadow:0 0 16px rgba(255,0,255,0.8);
      white-space:pre-wrap;
      letter-spacing:0.1em;
      line-height:1.5;
    }

    #admin-msg .box-cursor {
      display:inline-block;
      width:10px;
      height:1.1em;
      background:#ff00ff;
      vertical-align:middle;
      margin-left:4px;
      box-shadow:0 0 8px #ff00ff;
      animation:blink .8s step-end infinite;
    }

    #admin-msg .box-footer {
      padding:6px 14px;
      border-top:1px solid #1a001a;
      font-size:10px;
      color:#330033;
      text-align:right;
      letter-spacing:0.1em;
    }

    @keyframes blink { 50% { opacity:0; } }

    @keyframes glitch-skew {
      0%   { transform:skewX(0deg); }
      10%  { transform:skewX(-6deg) scaleX(1.04); }
      20%  { transform:skewX(4deg); }
      30%  { transform:skewX(0deg); }
      40%  { transform:skewX(8deg) scaleX(0.97); }
      50%  { transform:skewX(-3deg); }
      60%  { transform:skewX(0deg); }
      70%  { transform:skewX(5deg) scaleX(1.02); }
      80%  { transform:skewX(-4deg); }
      90%  { transform:skewX(2deg); }
      100% { transform:skewX(0deg); }
    }

    @keyframes glitch-color {
      0%   { filter:none; }
      15%  { filter:hue-rotate(90deg) saturate(3) brightness(1.5); }
      16%  { filter:none; }
      33%  { filter:hue-rotate(180deg) saturate(5) brightness(2) invert(0.3); }
      34%  { filter:none; }
      50%  { filter:hue-rotate(270deg) saturate(4) brightness(0.5) contrast(3); }
      51%  { filter:none; }
      67%  { filter:hue-rotate(45deg) saturate(6) brightness(1.8); }
      68%  { filter:none; }
      85%  { filter:hue-rotate(315deg) saturate(3) brightness(1.2) invert(0.1); }
      86%  { filter:none; }
      100% { filter:none; }
    }

    @keyframes glitch-shift {
      0%,100% { clip-path:inset(0 0 100% 0); left:0; }
      10% { clip-path:inset(20% 0 60% 0); left:-8px; }
      20% { clip-path:inset(50% 0 20% 0); left:6px; }
      30% { clip-path:inset(10% 0 80% 0); left:-4px; }
      40% { clip-path:inset(70% 0 5%  0); left:10px; }
      50% { clip-path:inset(35% 0 40% 0); left:-6px; }
      60% { clip-path:inset(5%  0 75% 0); left:4px; }
      70% { clip-path:inset(60% 0 15% 0); left:-10px; }
      80% { clip-path:inset(25% 0 55% 0); left:8px; }
      90% { clip-path:inset(45% 0 30% 0); left:-3px; }
    }

    body.glitching {
      animation:glitch-skew 0.15s steps(1) infinite, glitch-color 0.2s steps(1) infinite;
    }

    body.glitching::before,
    body.glitching::after {
      content:'';
      position:fixed;
      inset:0;
      background:inherit;
      pointer-events:none;
      z-index:9999;
    }

    body.glitching::before {
      animation:glitch-shift 0.13s steps(1) infinite;
      background:rgba(255,0,80,0.15);
      mix-blend-mode:screen;
    }

    body.glitching::after {
      animation:glitch-shift 0.17s steps(1) infinite reverse;
      background:rgba(0,255,255,0.1);
      mix-blend-mode:screen;
    }

    #terminal {
      position:fixed;
      bottom:0; left:0; right:0;
      height:220px;
      background:rgba(0,0,0,0.92);
      border-top:1px solid #003300;
      display:flex;
      flex-direction:column;
      z-index:100;
    }

    #chat-log {
      flex:1;
      overflow-y:auto;
      padding:8px 12px;
      font-size:12px;
      line-height:1.6;
    }

    #chat-log::-webkit-scrollbar { width:4px; }
    #chat-log::-webkit-scrollbar-thumb { background:#003300; }

    .msg-user { color:#00ff00; }
    .msg-admin { color:#ff00ff; text-shadow:0 0 6px #ff00ff; }
    .msg-system { color:#004400; }

    #input-row {
      display:flex;
      align-items:center;
      padding:6px 12px;
      border-top:1px solid #003300;
      gap:6px;
    }

    #prompt { color:#00ff00; font-size:12px; white-space:nowrap; }

    #chat-input {
      flex:1;
      background:none;
      border:none;
      outline:none;
      color:#00ff00;
      font-family:'Courier New', monospace;
      font-size:12px;
      caret-color:#00ff00;
    }

    #admin-panel {
      position:fixed;
      top:0; left:0; right:0;
      background:rgba(0,0,0,0.95);
      border-bottom:1px solid #330033;
      padding:8px 12px;
      display:none;
      gap:8px;
      align-items:center;
      z-index:200;
    }

    #admin-label { color:#ff00ff; font-size:12px; white-space:nowrap; }

    #admin-input {
      flex:1;
      background:none;
      border:none;
      border-bottom:1px solid #550055;
      outline:none;
      color:#ff00ff;
      font-family:'Courier New', monospace;
      font-size:12px;
      caret-color:#ff00ff;
      padding:2px 0;
    }

    #admin-send {
      background:none;
      border:1px solid #550055;
      color:#ff00ff;
      font-family:'Courier New', monospace;
      font-size:11px;
      padding:2px 10px;
      cursor:pointer;
    }
    #admin-send:hover { background:#1a001a; }

    #admin-clear {
      background:none;
      border:1px solid #330033;
      color:#550055;
      font-family:'Courier New', monospace;
      font-size:11px;
      padding:2px 10px;
      cursor:pointer;
    }
    #admin-clear:hover { background:#0a000a; }
  </style>
</head>
<body>
  <img id="logo" src="sollriz.png" alt="" />
  <img id="beach" src="the_beach.png" alt="" />
  <div id="admin-msg">
    <div class="box-titlebar">
      <div class="box-dot"></div>
      <div class="box-dot" style="opacity:0.4"></div>
      <div class="box-dot" style="opacity:0.2"></div>
      <span class="box-title">broadcast // olriz</span>
    </div>
    <div class="box-body">
      <div class="box-prompt">root@olriz:~# echo $MSG</div>
      <div><span class="box-text"></span><span class="box-cursor"></span></div>
    </div>
    <div class="box-footer">press ctrl+c to dismiss</div>
  </div>

  <div id="admin-panel">
    <span id="admin-label">[ADMIN]&gt;</span>
    <input id="admin-input" type="text" placeholder="broadcast message..." autocomplete="off" />
    <button id="admin-send">send</button>
    <button id="admin-clear">clear</button>
  </div>

  <div id="terminal">
    <div id="chat-log"></div>
    <div id="input-row">
      <span id="prompt">guest@olriz:~$</span>
      <input id="chat-input" type="text" autocomplete="off" maxlength="200" placeholder="type and press Enter..." />
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, push, onChildAdded, set, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const app = initializeApp({
      databaseURL: 'https://sollriz-default-rtdb.europe-west1.firebasedatabase.app'
    });
    const db = getDatabase(app);

    const log = document.getElementById('chat-log');
    const input = document.getElementById('chat-input');
    const adminPanel = document.getElementById('admin-panel');
    const adminInput = document.getElementById('admin-input');
    const adminMsg = document.getElementById('admin-msg');
    const prompt = document.getElementById('prompt');

    let username = '';
    let isAdmin = false;

    function addLine(text, cls) {
      const d = document.createElement('div');
      d.className = cls || 'msg-user';
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function checkAdmin() {
      try {
        const r = await fetch('https://api.ipify.org?format=json');
        const j = await r.json();
        return j.ip === atob('NzkuMTM3LjEzNi4xNg==');
      } catch(e) { return false; }
    }

    async function askName() {
      addLine('> connecting to olriz...', 'msg-system');
      isAdmin = await checkAdmin();
      addLine('> enter your name:', 'msg-system');
      input.placeholder = 'your name...';
      input.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        const val = input.value.trim();
        if (!val) return;
        if (isAdmin || val === atob('c29sa2FhZG1pbg==')) {
          username = 'ADMIN';
          adminPanel.style.display = 'flex';
          addLine('> authenticated as ADMIN', 'msg-system');
          prompt.textContent = 'admin@olriz:~$';
        } else {
          username = val.slice(0, 20);
          addLine('> connected as ' + username, 'msg-system');
        }
        input.placeholder = 'type and press Enter...';
        input.value = '';
        setupChat();
      };
    }

    function setupChat() {
      onChildAdded(ref(db, 'chat'), (snap) => {
        const m = snap.val();
        if (m.admin) {
          addLine('[ADMIN] ' + m.text, 'msg-admin');
        } else {
          addLine('[' + m.user + '] ' + m.text, 'msg-user');
        }
      });

      onValue(ref(db, 'broadcast'), (snap) => {
        const val = snap.val();
        const box = document.getElementById('admin-msg');
        if (val && val.text) {
          const txt = val.text;
          box.querySelector('.box-text').textContent = txt;
          box.style.display = 'block';
        } else {
          box.style.display = 'none';
        }
      });

      input.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        const val = input.value.trim();
        if (!val) return;
        push(ref(db, 'chat'), {
          user: username,
          text: val,
          admin: isAdmin,
          ts: Date.now()
        });
        input.value = '';
      };

      if (isAdmin) {
        document.getElementById('admin-send').onclick = () => {
          const val = adminInput.value.trim();
          if (!val) return;
          set(ref(db, 'broadcast'), { text: val });
          adminInput.value = '';
        };
        adminInput.onkeydown = (e) => {
          if (e.key === 'Enter') document.getElementById('admin-send').click();
        };
        document.getElementById('admin-clear').onclick = () => {
          remove(ref(db, 'broadcast'));
        };
      }
    }

    askName();

    (function(){
      var seq='', code=atob('ZWxpcw==');
      document.addEventListener('keydown', function(e){
        seq=(seq+e.key).slice(-code.length);
        if(seq===code){
          seq='';
          document.body.classList.add('glitching');
          setTimeout(function(){ document.body.classList.remove('glitching'); }, 5000);
        }
      });
    })();
  </script>
</body>
</html>
