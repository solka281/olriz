<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 6vh;
    }

    img {
      display: block;
      max-width: min(420px, 80vw);
      height: auto;
    }
  </style>
</head>
<body>
  <img src="tv4.jpg" alt="" />
</body>
</html>
